name: İstatistik

on:
  schedule:
    - cron: "35 20 * * *"  # her gün 23:35 İstanbul
  workflow_dispatch:

concurrency:
  group: istatistik
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  istatistik:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            paylasim
            istatistik
            takvim.json
            durum.json
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: İstatistikleri topla
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PLATFORMLAR: ${{ vars.PLATFORMLAR }}
        run: python -m paylasim istatistik

      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add istatistik 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "İstatistik $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
