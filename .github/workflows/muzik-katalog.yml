name: Müzik kataloğu

on:
  workflow_dispatch:
    inputs:
      analiz:
        description: "Parçaların önizlemesinden tempo, ton ve enerji çıkar"
        type: boolean
        default: true

concurrency:
  group: katalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            paylasim
            muzik
            requirements.txt
            takvim.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          if [ "$ANALIZ" = "true" ]; then pip install -q librosa soundfile numpy; fi
        env:
          ANALIZ: ${{ inputs.analiz }}

      - name: Kütüphaneyi tara
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANALIZ: ${{ inputs.analiz }}
        run: python -m paylasim katalog

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muzik/katalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Müzik kataloğu"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
