name: Paylaş

on:
  schedule:
    # GitHub saatleri UTC'dir. Türkiye UTC+3 (yaz saati yok).
    # GitHub'ın zamanlayıcısı 45–60 dakika gecikebildiği için iş slot çevresinde 10 dakikada bir tetiklenir.
    # Slottan 12 dakikadan daha erken başlayan çalışma hemen çıkar; slot paylaşıldıktan sonrakiler de bir şey yapmaz.
    - cron: "3-59/10 8-9 * * *"    # 11:03–12:53 İstanbul -> 12:30 paylaşımı
    - cron: "33-59/10 15 * * *"    # 18:33–18:53 İstanbul -> 20:00 paylaşımı
    - cron: "3-59/10 16 * * *"     # 19:03–19:53 İstanbul
    - cron: "3-23/10 17 * * *"     # 20:03–20:23 İstanbul
    # 9–20 Kasım: Instagram'da elle paylaşılmış 23 bölüm YouTube'a da yükleniyor (yalnız YouTube, 16:00 ve 22:30).
    - cron: "33-59/10 11 9-20 11 *"   # 14:33–14:53 İstanbul -> 16:00 paylaşımı
    - cron: "3-59/10 12 9-20 11 *"    # 15:03–15:53 İstanbul
    - cron: "3-23/10 13 9-20 11 *"    # 16:03–16:23 İstanbul
    - cron: "3-59/10 18-19 9-20 11 *" # 21:03–22:53 İstanbul -> 22:30 paylaşımı
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (ör. 2026-11-20-1230). Boş bırakırsan saati gelen slot."
        required: false
        default: ""
      platform:
        description: "Platform"
        type: choice
        options: [hepsi, instagram, youtube]
        default: hepsi
      deneme:
        description: "Deneme: Instagram'a yüklenir ama yayınlanmaz, YouTube'a gizli yüklenir"
        type: boolean
        default: false

concurrency:
  group: paylas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Paylaş
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PLATFORMLAR: ${{ vars.PLATFORMLAR }}
          MUZIK: ${{ vars.MUZIK }}
          MUZIK_SES: ${{ vars.MUZIK_SES }}
          IG_VIDEO_TABAN: ${{ vars.IG_VIDEO_TABAN }}
          VIDEO_SES: ${{ vars.VIDEO_SES }}
          SLOT: ${{ inputs.slot }}
          PLATFORM: ${{ inputs.platform }}
          DENEME: ${{ inputs.deneme }}
        run: |
          ARGS=(paylas --platform "${PLATFORM:-hepsi}")
          if [ -n "$SLOT" ]; then ARGS+=(--slot "$SLOT"); fi
          if [ "$DENEME" = "true" ]; then ARGS+=(--deneme); fi
          python -m paylasim "${ARGS[@]}"

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Paylaşım durumu: ${SLOT:-planlı}"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
        env:
          SLOT: ${{ inputs.slot }}
